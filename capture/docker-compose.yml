# Local development stack for the capture service: its own Postgres, the API
# and one worker, sharing a local artifact store. Nothing here touches the
# current MemoryLane stack or Supabase.
#
#   cd capture && docker compose up -d --build
#   docker compose exec api python -m memlane_capture.admin add-contributor "Me" --email me@example.org --role admin
#   docker compose exec api python -m memlane_capture.admin add-token me@example.org "laptop"
#   curl -H "Authorization: Bearer mlc_..." -H "Content-Type: application/json" \
#        -d '{"url":"https://www.threads.com/@user/post/XYZ"}' http://127.0.0.1:8700/v1/inbox

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capture
      POSTGRES_PASSWORD: capture
      POSTGRES_DB: capture
    volumes:
      - capture-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capture"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["uvicorn", "memlane_capture.api:app", "--host", "0.0.0.0", "--port", "8700", "--proxy-headers"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://capture:capture@db:5432/capture
      REPLAY_URL: ${REPLAY_URL:-http://127.0.0.1:8701}
    ports:
      - "127.0.0.1:8700:8700"
    restart: unless-stopped
    volumes:
      - capture-store:/data/store
      - capture-feed:/data/feed
      # key files named in .env (feed signing): gitignored, read-only
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://capture:capture@db:5432/capture
      WORKER_CONCURRENCY: "2"
    volumes:
      - capture-store:/data/store
      - capture-feed:/data/feed
      - ./secrets:/secrets:ro
    shm_size: "1gb"          # Chromium's shared memory; the default 64 MB crashes tabs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # The replay viewer for captures' WACZ files, on its own origin (another port here, another hostname when
  # deployed): replay runs captured scripts, so it must share nothing with the hub. No database, no secrets.
  replay:
    build: .
    command: ["uvicorn", "memlane_capture.replay:app", "--host", "0.0.0.0", "--port", "8701", "--proxy-headers"]
    environment:
      HUB_INTERNAL_URL: http://api:8700
    ports:
      - "127.0.0.1:8701:8701"
    restart: unless-stopped
    depends_on: [api]

volumes:
  capture-db:
  capture-store:
  capture-feed:        # the publication feed, written by the worker; served at /feed/ only with FEED_SERVE_LOCAL
