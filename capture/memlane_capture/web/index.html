<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lưu trữ MemoryLane</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="bar">
    <a href="#/incidents" class="brand" id="brand">Lưu trữ MemoryLane</a>
    <nav class="main" id="nav" hidden></nav>
    <span class="spacer"></span>
    <button id="quick-save" class="primary small-btn" type="button" hidden>+ Lưu liên kết</button>
    <a id="bell" class="bell" href="#/notifications" hidden aria-label="Thông báo">🔔<span id="bell-count" class="bell-count" hidden></span></a>
    <span id="who" class="muted who"></span>
    <button id="tour-btn" class="tour-btn" type="button" hidden aria-label="Hướng dẫn">i</button>
    <button id="lang" class="link" type="button">EN</button>
    <button id="logout" class="link" type="button" hidden>Đăng xuất</button>
  </header>

  <main>
    <section id="connect" class="card narrow" hidden>
      <h1 id="connect-title">Kết nối</h1>
      <p id="connect-help" class="muted"></p>
      <form id="connect-form">
        <input id="token" type="password" autocomplete="off" placeholder="mlc_…" required aria-label="token">
        <button id="connect-btn" type="submit" class="primary">Kết nối</button>
      </form>
      <p id="connect-error" class="error" hidden></p>
    </section>
    <div id="view"></div>
  </main>
</body>
</html>
