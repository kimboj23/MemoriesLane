# Static mirror of the ArchiveBox archive. Everything under /srv/data is
# written by the sync container; /srv/static holds the two tiny assets
# ArchiveBox's per-snapshot index.html references as ../../static/*.
server {
    listen 80;
    server_name _;

    root  /srv/data;
    index index.html;

    # Snapshot pages live at /archive/<timestamp>/index.html and reference
    # ../../static/archive.png -> /static/archive.png.
    location /static/ {
        alias /srv/static/;
        expires 30d;   # `expires` sets Cache-Control without add_header -- headers still inherit here
    }

    location / {
        try_files $uri $uri/ =404;
    }

    include /etc/nginx/snippets/headers.conf;

    # Front page is regenerated hourly; don't let browsers cache it long.
    # Re-include the security headers: setting Cache-Control here would
    # otherwise discard them for this location (see headers.conf).
    location = /index.html {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Discoverability is the point of a censorship archive.
    location = /robots.txt {
        return 200 "User-agent: *\nAllow: /\n";
    }

    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # WARC/PDF/singlefile can be tens of MB; let them stream.
    sendfile on;
    tcp_nopush on;

    access_log off;   # a mirror keeps no visitor logs -- nothing to seize
    error_log /dev/stderr warn;
}
