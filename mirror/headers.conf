# Included at server level AND inside any location that has its own
# add_header: nginx's add_header is not inherited once a location sets one
# of its own, so a location adding only Cache-Control would silently drop
# every security header below. (Caught in testing -- CSP vanished on "/".)
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# Captured pages carry third-party scripts frozen at capture time. Keep them
# from phoning home from the mirror's origin: nothing beyond the page's own
# inlined/same-origin resources. No frame-ancestors on purpose: ArchiveBox's
# snapshot index.html iframes its own outputs, and readers embed snapshots.
add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; frame-src 'self'; connect-src 'none'; form-action 'none'" always;
